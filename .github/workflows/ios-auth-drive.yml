name: Courier iOS Auth Drive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courier-ios-auth-drive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-auth-drive:
    runs-on: macos-26
    timeout-minutes: 35

    env:
      E2E_COURIER_PHONE: ${{ secrets.E2E_COURIER_PHONE }}
      E2E_COURIER_PASSWORD: ${{ secrets.E2E_COURIER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate E2E credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${E2E_COURIER_PHONE:-}"
          test -n "${E2E_COURIER_PASSWORD:-}"
          echo "Courier E2E credentials are configured"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Boot clean iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios-auth-drive
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[r for r in d["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name","")]; a.sort(key=lambda r: tuple(int(x) for x in r.get("version","0").split("."))); print(a[-1]["identifier"])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; a=[d for d in json.load(sys.stdin)["devicetypes"] if d.get("name","").startswith("iPhone")]; pref=["iPhone 17 Pro","iPhone 17","iPhone 16 Pro","iPhone 16"]; by={d["name"]:d for d in a}; pick=next((by[n] for n in pref if n in by),a[-1]); print(pick["identifier"])')
          UDID=$(xcrun simctl create "JETKIZ Courier Auth Drive" "$DEVICE_TYPE" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          flutter devices

      - name: Build and launch production courier auth smoke
        timeout-minutes: 15
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --no-pub \
            --dart-define=JETKIZ_API_BASE_URL=https://api.jetkiz.asia \
            --dart-define=E2E_AUTH_SMOKE=true \
            --dart-define=E2E_COURIER_PHONE="$E2E_COURIER_PHONE" \
            --dart-define=E2E_COURIER_PASSWORD="$E2E_COURIER_PASSWORD"

          APP=build/ios/iphonesimulator/Runner.app
          LOG=build/ios-auth-drive/runner.log
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" asia.jetkiz.courier

          for attempt in $(seq 1 45); do
            xcrun simctl spawn "$UDID" log show --style compact --last 2m --predicate 'process == "Runner"' > "$LOG" || true
            if grep -Fq 'JETKIZ_E2E_AUTH_OK' "$LOG"; then
              echo 'Production courier login smoke passed'
              exit 0
            fi
            if grep -Fq 'JETKIZ_E2E_AUTH_FAILED' "$LOG"; then
              grep -F 'JETKIZ_E2E_AUTH_FAILED' "$LOG" || true
              exit 1
            fi
            sleep 2
          done

          echo 'Timed out waiting for courier auth smoke marker' >&2
          tail -200 "$LOG" || true
          exit 1

      - name: Capture simulator evidence
        if: always() && steps.simulator.outputs.udid != ''
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p build/ios-auth-drive
          xcrun simctl io "$UDID" screenshot build/ios-auth-drive/final-screen.png || true
          xcrun simctl spawn "$UDID" log show --style compact --last 10m --predicate 'process == "Runner"' > build/ios-auth-drive/runner.log || true

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: courier-ios-auth-drive-evidence
          path: |
            build/ios-auth-drive/final-screen.png
            build/ios-auth-drive/runner.log
          if-no-files-found: warn
          retention-days: 14

      - name: Shutdown simulator
        if: always() && steps.simulator.outputs.udid != ''
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true
