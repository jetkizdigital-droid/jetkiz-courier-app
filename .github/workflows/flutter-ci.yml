name: Courier Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/courier-production-hardening-20260829
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release AAB with ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rm -f android/key.properties android/ci-release.jks
          }
          trap cleanup EXIT
          keytool -genkeypair \
            -keystore android/ci-release.jks \
            -storepass ci-password \
            -keypass ci-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -alias ci \
            -dname "CN=JETKIZ CI, OU=CI, O=JETKIZ, L=Shchuchinsk, ST=Akmola, C=KZ" \
            >/dev/null 2>&1
          cat > android/key.properties <<'EOF'
          storePassword=ci-password
          keyPassword=ci-password
          keyAlias=ci
          storeFile=../ci-release.jks
          EOF
          flutter build appbundle --release
      - name: Verify 16 KB native library alignment
        shell: bash
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          test -f "$aab"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -qq "$aab" 'base/lib/*/*.so' -d "$tmp"
          python3 - "$tmp" <<'PY'
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          libraries = sorted(root.glob('base/lib/*/*.so'))
          if not libraries:
              raise SystemExit('No native libraries found in release AAB')

          bad = []
          for library in libraries:
              output = subprocess.check_output(['readelf', '-lW', str(library)], text=True)
              load_alignments = []
              for line in output.splitlines():
                  fields = line.split()
                  if fields and fields[0] == 'LOAD':
                      load_alignments.append(int(fields[-1], 0))
              if not load_alignments or min(load_alignments) < 16384:
                  bad.append((str(library), load_alignments))

          if bad:
              for library, alignments in bad:
                  print(f'16KB alignment failure: {library}: {alignments}')
              raise SystemExit(1)

          print(f'16KB alignment verified for {len(libraries)} native libraries')
          PY
