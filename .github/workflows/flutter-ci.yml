name: Courier Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/courier-production-hardening-20260829
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/verify_launcher_icons.py'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify branded launcher sources
        run: python3 tool/verify_launcher_icons.py

      - name: Verify production Firebase client configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('android/app/google-services.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data.get('project_info', {}).get('project_id') == 'jetkiz-mobile', 'Wrong Firebase project_id'
          clients = data.get('client') or []
          packages = {
              item.get('client_info', {}).get('android_client_info', {}).get('package_name')
              for item in clients
          }
          assert 'asia.jetkiz.courier' in packages, 'Courier package is missing from google-services.json'
          print('Firebase client configuration verified')
          PY

      - name: Verify courier notification sources
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -F 'com.google.firebase.messaging.default_notification_channel_id' android/app/src/main/AndroidManifest.xml
          grep -F 'courier_orders_v2' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/raw/courier_order.mp3
          grep -F "productionBaseUrl = 'https://api.jetkiz.asia'" lib/core/network/apiClient.dart
          echo 'Courier notification sources verified'

      - name: Format sources
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare ephemeral CI release signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/courier-ci-upload.jks" \
            -storepass ci-not-for-production \
            -keypass ci-not-for-production \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -alias courier-ci \
            -dname "CN=JETKIZ Courier CI,O=JETKIZ,C=KZ"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/courier-ci-upload.jks
          storePassword=ci-not-for-production
          keyAlias=courier-ci
          keyPassword=ci-not-for-production
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify Play metadata, API level, permissions and notification resources
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/courier-badging.txt
          "$AAPT" dump permissions "$APK" > /tmp/courier-permissions.txt
          "$AAPT" dump resources "$APK" > /tmp/courier-resources.txt
          grep -F "package: name='asia.jetkiz.courier'" /tmp/courier-badging.txt
          grep -Eq "versionCode='([3-9]|[1-9][0-9]+)'" /tmp/courier-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/courier-badging.txt
          grep -F "application-label:'JETKIZ Курьер'" /tmp/courier-badging.txt
          grep -F "android.permission.POST_NOTIFICATIONS" /tmp/courier-permissions.txt
          grep -F "android.permission.ACCESS_FINE_LOCATION" /tmp/courier-permissions.txt
          grep -F "android.permission.ACCESS_BACKGROUND_LOCATION" /tmp/courier-permissions.txt
          grep -F "android.permission.FOREGROUND_SERVICE_LOCATION" /tmp/courier-permissions.txt
          grep -F "android.permission.WAKE_LOCK" /tmp/courier-permissions.txt
          grep -F "mipmap/ic_launcher" /tmp/courier-resources.txt
          grep -F "mipmap/ic_launcher_round" /tmp/courier-resources.txt
          grep -F "asia.jetkiz.courier:raw/courier_order" /tmp/courier-resources.txt
          echo 'Play metadata, permissions and notification resources verified'

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify release AAB structure
        shell: bash
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -Z1 "$AAB" | grep -F "base/manifest/AndroidManifest.xml"
          unzip -Z1 "$AAB" | grep -F "base/resources.pb"
          echo "Release AAB structure verified"

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/courier-ci-upload.jks"
