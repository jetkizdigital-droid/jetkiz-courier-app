name: Courier Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/courier-production-hardening-20260829
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format --output=none lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release AAB with ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rm -f android/key.properties android/ci-release.jks
          }
          trap cleanup EXIT
          keytool -genkeypair \
            -keystore android/ci-release.jks \
            -storepass ci-password \
            -keypass ci-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -alias ci \
            -dname "CN=JETKIZ CI, OU=CI, O=JETKIZ, L=Shchuchinsk, ST=Akmola, C=KZ" \
            >/dev/null 2>&1
          cat > android/key.properties <<'EOF'
          storePassword=ci-password
          keyPassword=ci-password
          keyAlias=ci
          storeFile=../ci-release.jks
          EOF
          flutter build appbundle --release
