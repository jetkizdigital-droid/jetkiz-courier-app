name: Finalize courier push hardening

on:
  push:
    branches:
      - fix/courier-format-normalization

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/courier-format-normalization

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply final courier push fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          push = Path('lib/core/push/push_message_service.dart')
          text = push.read_text(encoding='utf-8')
          needle = "          sound: 'courier_order.mp3',\n"
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'Expected 2 courier iOS custom sound references, found {count}')
          text = text.replace(needle, '')
          push.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/flutter-ci.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '          test -s android/app/src/main/res/raw/courier_order.mp3\n'
          new = '          test -s android/app/src/main/res/raw/courier_order.wav\n'
          if text.count(old) != 1:
              raise SystemExit('Expected courier_order.mp3 source check exactly once')
          workflow.write_text(text.replace(old, new), encoding='utf-8')
          PY
          dart format lib/core/push/push_message_service.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-courier-format-normalization.yml
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          allowed='^(\.github/workflows/apply-courier-format-normalization\.yml|\.github/workflows/flutter-ci\.yml|lib/core/push/push_message_service\.dart)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected finalizer change: $path"; exit 1; }
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(push): finalize courier notification resources'
          git push origin HEAD:fix/courier-format-normalization
