name: Apply courier format normalization

on:
  push:
    branches:
      - fix/courier-format-normalization

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/courier-format-normalization

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format exact drifted files
        run: |
          dart format \
            lib/core/push/push_message_service.dart \
            lib/core/push/push_registration_service.dart \
            lib/main.dart \
            test/core/api_client_session_test.dart \
            test/core/localization_catalog_test.dart \
            test/core/push_registration_result_test.dart \
            test/orders/courier_order_model_test.dart

      - name: Verify scope and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed='^(lib/core/push/push_message_service\.dart|lib/core/push/push_registration_service\.dart|lib/main\.dart|test/core/api_client_session_test\.dart|test/core/localization_catalog_test\.dart|test/core/push_registration_result_test\.dart|test/orders/courier_order_model_test\.dart)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected formatted file: $path"; exit 1; }
          done
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo 'Formatting already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'style: normalize courier Dart formatting'
          git push origin HEAD:fix/courier-format-normalization
