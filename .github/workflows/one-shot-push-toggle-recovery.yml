name: One-shot courier push recovery

on:
  push:
    branches:
      - fix/courier-push-toggle-recovery
    paths:
      - .github/workflows/one-shot-push-toggle-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/courier-push-toggle-recovery
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply courier-specific push preference fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def add_import(source: str, anchor: str, new_import: str) -> str:
              if new_import in source:
                  return source
              if anchor not in source:
                  raise RuntimeError(f'import anchor not found: {anchor}')
              return source.replace(anchor, anchor + new_import, 1)

          def replace_method(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              file.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          preference = Path('lib/core/push/courier_push_preference.dart')
          preference.write_text(textwrap.dedent("""
          import 'package:shared_preferences/shared_preferences.dart';

          /// Courier notification intent is app-specific and must not reuse the
          /// client application's pushEnabled server setting.
          class CourierPushPreference {
            static const String _key = 'jetkiz.courier.pushEnabled';

            static Future<bool> isEnabled() async {
              final preferences = await SharedPreferences.getInstance();
              return preferences.getBool(_key) ?? true;
            }

            static Future<void> setEnabled(bool value) async {
              final preferences = await SharedPreferences.getInstance();
              await preferences.setBool(_key, value);
            }
          }
          """).lstrip(), encoding='utf-8')

          auth = Path('lib/features/auth/presentation/auth_gate.dart')
          auth_source = auth.read_text(encoding='utf-8')
          auth_source = add_import(
              auth_source,
              "import 'package:jetkiz_courier_app/core/push/push_registration_service.dart';\n",
              "import 'package:jetkiz_courier_app/core/push/courier_push_preference.dart';\n",
          )
          auth.write_text(auth_source, encoding='utf-8')
          replace_method(
              str(auth),
              '  Future<void> _restorePushRegistrationBestEffort() async {',
              '  String _keyFor(ApiException error) {',
              textwrap.dedent("""
                Future<void> _restorePushRegistrationBestEffort() async {
                  PushRegistrationService? push;
                  try {
                    if (!await CourierPushPreference.isEnabled()) return;

                    push = PushRegistrationService(apiClient: _api);
                    final result = await push.initializeAndRegister();
                    if (!result.success) {
                      debugPrint(
                        'Courier push registration incomplete during auth: '
                        '${result.failureStage.name}: ${result.message ?? 'unknown'}',
                      );
                    }
                  } catch (error) {
                    debugPrint(
                      'Courier push registration failed during auth: ${error.runtimeType}',
                    );
                  } finally {
                    await push?.dispose();
                  }
                }

          """).lstrip('\n'),
          )

          shell = Path('lib/features/navigation/presentation/courier_shell.dart')
          shell_source = shell.read_text(encoding='utf-8')
          shell_source = add_import(
              shell_source,
              "import 'package:jetkiz_courier_app/core/push/push_registration_service.dart';\n",
              "import 'package:jetkiz_courier_app/core/push/courier_push_preference.dart';\n",
          )
          shell.write_text(shell_source, encoding='utf-8')
          replace_method(
              str(shell),
              '  Future<void> _startAuthenticatedSession() async {',
              '  @override\n  void didChangeAppLifecycleState',
              textwrap.dedent("""
                Future<void> _startAuthenticatedSession() async {
                  try {
                    await _locale.syncAuthenticated(_api);
                  } catch (_) {
                    // Local language remains available if settings sync is unavailable.
                  }

                  try {
                    if (!await CourierPushPreference.isEnabled()) {
                      debugPrint('Courier push registration skipped: courier preference disabled');
                      return;
                    }

                    final result = await _pushRegistration.initializeAndRegister();
                    if (!result.success) {
                      debugPrint(
                        'Courier push registration incomplete: '
                        '${result.failureStage.name}: ${result.message ?? 'unknown'}',
                      );
                    } else {
                      debugPrint('Courier push registration succeeded');
                    }
                  } catch (error) {
                    debugPrint('Courier push registration failed: ${error.runtimeType}');
                  }
                }

          """).lstrip('\n'),
          )

          profile = Path('lib/features/profile/presentation/courier_profile_page.dart')
          profile_source = profile.read_text(encoding='utf-8')
          profile_source = add_import(
              profile_source,
              "import 'package:jetkiz_courier_app/core/push/push_registration_service.dart';\n",
              "import 'package:jetkiz_courier_app/core/push/courier_push_preference.dart';\n",
          )
          profile.write_text(profile_source, encoding='utf-8')
          replace_method(
              str(profile),
              '  Future<void> _load() async {',
              '  Future<void> _pickAvatar() async {',
              textwrap.dedent("""
                Future<void> _load() async {
                  if (mounted) {
                    setState(() {
                      _loading = true;
                      _errorKey = null;
                    });
                  }
                  try {
                    final me = _asMap(await _client.get('/couriers/me'));
                    final pushEnabled = await CourierPushPreference.isEnabled();
                    final profile = _map(me['courierProfile']) ?? _map(me['profile']);
                    final first = _firstText([me['firstName'], profile?['firstName']]);
                    final last = _firstText([me['lastName'], profile?['lastName']]);
                    final fullName = [first, last].where((v) => v.isNotEmpty).join(' ');

                    if (!mounted) return;
                    setState(() {
                      _name = fullName;
                      _avatarUrl = _normalizeImageUrl(
                        _firstText([me['avatarUrl'], profile?['avatarUrl']]),
                      );
                      _online = _bool(me['isOnline']) || _bool(profile?['isOnline']);
                      _ordersCount =
                          _int(me['ordersCount']) ??
                          _int(_map(me['stats'])?['completedOrders']) ??
                          0;
                      _pushEnabled = pushEnabled;
                    });
                  } on ApiException catch (error) {
                    if (mounted) setState(() => _errorKey = _errorFor(error));
                  } catch (_) {
                    if (mounted) setState(() => _errorKey = 'error.generic');
                  } finally {
                    if (mounted) setState(() => _loading = false);
                  }
                }

          """).lstrip('\n'),
          )
          replace_method(
              str(profile),
              '  Future<void> _setPushEnabled(bool value) async {',
              '  Future<void> _logoutAccount() async {',
              textwrap.dedent("""
                Future<void> _setPushEnabled(bool value) async {
                  if (_savingSettings || value == _pushEnabled) return;
                  setState(() => _savingSettings = true);
                  final push = PushRegistrationService(apiClient: _client);
                  try {
                    if (value) {
                      // Persist courier intent first so a temporary FCM/network failure
                      // cannot leave future authenticated starts permanently disabled.
                      await CourierPushPreference.setEnabled(true);
                      if (mounted) setState(() => _pushEnabled = true);

                      final registration = await push.initializeAndRegister();
                      final permissionGranted = registration.permission?.isGranted == true;

                      if (!permissionGranted) {
                        debugPrint(
                          'Courier push enable incomplete: '
                          '${registration.failureStage.name}, '
                          'permission=${registration.permission?.authorizationStatus ?? 'unknown'}',
                        );
                        _show(
                          _locale.isKazakh
                              ? 'Хабарландырулар қосылды, бірақ телефон JETKIZ хабарландыруларына рұқсат бермеген. Телефон баптауларында рұқсатты қосыңыз.'
                              : 'Уведомления включены, но телефон не дал JETKIZ разрешение на уведомления. Разрешите их в настройках телефона.',
                        );
                        return;
                      }

                      if (!registration.success) {
                        debugPrint(
                          'Courier push enable incomplete: '
                          '${registration.failureStage.name}: ${registration.message ?? 'unknown'}',
                        );
                        _show(
                          _locale.isKazakh
                              ? 'Хабарландырулар қосылды. Құрылғыны push жүйесіне тіркеуді қолданба автоматты түрде қайталайды.'
                              : 'Уведомления включены. Приложение автоматически повторит регистрацию устройства для push.',
                        );
                        return;
                      }

                      debugPrint('Courier push enabled: device registered');
                      _show(
                        _locale.isKazakh
                            ? 'Хабарландырулар қосылды'
                            : 'Уведомления включены',
                      );
                    } else {
                      await CourierPushPreference.setEnabled(false);
                      if (mounted) setState(() => _pushEnabled = false);
                      try {
                        await push.unregisterCurrentToken();
                      } catch (error) {
                        debugPrint(
                          'Courier push unregister failed after local preference disabled: '
                          '${error.runtimeType}',
                        );
                      }
                    }
                  } on ApiException catch (error) {
                    _show(_locale.t(_errorFor(error)));
                  } catch (error) {
                    debugPrint('Courier push preference update failed: ${error.runtimeType}');
                    _show(_locale.t('profile.settingsSaveFailed'));
                  } finally {
                    await push.dispose();
                    if (mounted) setState(() => _savingSettings = false);
                  }
                }

          """).lstrip('\n'),
          )

          test = Path('test/core/courier_push_preference_test.dart')
          test.write_text(textwrap.dedent("""
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:jetkiz_courier_app/core/push/courier_push_preference.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            setUp(() {
              SharedPreferences.setMockInitialValues(<String, Object>{});
            });

            test('courier push is enabled by default', () async {
              expect(await CourierPushPreference.isEnabled(), isTrue);
            });

            test('courier push preference persists independently', () async {
              await CourierPushPreference.setEnabled(false);
              expect(await CourierPushPreference.isEnabled(), isFalse);
              await CourierPushPreference.setEnabled(true);
              expect(await CourierPushPreference.isEnabled(), isTrue);
            });

            test('courier push flow no longer depends on client settings pushEnabled', () {
              final auth = File(
                'lib/features/auth/presentation/auth_gate.dart',
              ).readAsStringSync();
              final shell = File(
                'lib/features/navigation/presentation/courier_shell.dart',
              ).readAsStringSync();
              final profile = File(
                'lib/features/profile/presentation/courier_profile_page.dart',
              ).readAsStringSync();

              expect(auth, isNot(contains("get('/client-settings/me')")));
              expect(shell, isNot(contains("get('/client-settings/me')")));
              expect(
                profile,
                isNot(contains("patch('/client-settings/me', {'pushEnabled'")),
              );
            });
          }
          """).lstrip(), encoding='utf-8')
          PY
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Commit clean fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "jetkizdigital-droid"
          git config user.email "jetkizdigital@gmail.com"
          git add lib/core/push/courier_push_preference.dart \
            lib/features/auth/presentation/auth_gate.dart \
            lib/features/navigation/presentation/courier_shell.dart \
            lib/features/profile/presentation/courier_profile_page.dart \
            test/core/courier_push_preference_test.dart
          git rm .github/workflows/one-shot-push-toggle-recovery.yml
          git commit -m "fix(push): decouple courier notifications from client preference"
          git push origin HEAD:fix/courier-push-toggle-recovery
