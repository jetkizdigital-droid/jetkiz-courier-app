name: Courier Launcher Icon Generation Once

on:
  push:
    branches:
      - fix/google-play-launcher-icon

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[launcher-icons-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/google-play-launcher-icon
          fetch-depth: 0

      - name: Generate branded launcher resources
        run: python3 tool/generate_jetkiz_courier_icons.py

      - name: Commit generated PNG resources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/mipmap-*/ic_launcher.png
          git add android/app/src/main/res/mipmap-*/ic_launcher_round.png
          git add android/app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png
          git diff --cached --quiet && exit 0
          git commit -m "fix(android): replace Flutter launcher icons with JETKIZ brand [launcher-icons-generated]"
          git push origin HEAD:fix/google-play-launcher-icon
